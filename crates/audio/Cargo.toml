[package]
authors = ["Icemic <bingfeng.web@gmail.com>"]
description = "Audio plugin for Moyu."
edition = "2024"
license = "MPL-2.0"
name = "moyu_audio"
repository = "https://github.com/DeepSpaceMill/moyu"
version.workspace = true

[features]
default = []
desktop = []
web = []

[dependencies]
anyhow = {workspace = true}
kira = {workspace = true}
log = {workspace = true}
serde = {workspace = true}
symphonia = {workspace = true}
ts-rs = {workspace = true}

moyu_core = {workspace = true, features = ["js_runtime"]}
moyu_macros = {workspace = true}
moyu_pal = {workspace = true}

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
send_wrapper = "0.6"
wasm-bindgen = {workspace = true}
wasm-bindgen-futures = {workspace = true}
web-sys = {workspace = true, features = [
	"AudioContext",
	"AudioContextState",
	"AudioBuffer",
	"AudioBufferSourceNode",
	"AudioDestinationNode",
	"AudioNode",
	"AudioScheduledSourceNode",
	"BaseAudioContext",
	"Event",
	"EventTarget",
	"Window",
]}

[dev-dependencies]
arc-swap = {workspace = true}
