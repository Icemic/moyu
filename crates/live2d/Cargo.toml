[package]
authors = ["Icemic <bingfeng.web@gmail.com>"]
description = "Live2D node and renderer for Moyu engine."
edition = "2024"
license = "MPL-2.0"
name = "moyu_live2d"
repository = "https://github.com/DeepSpaceMill/moyu"
version.workspace = true

[dependencies]
anyhow = {workspace = true}
bytemuck = {workspace = true}
glam = {workspace = true}
log = {workspace = true}
serde = {workspace = true}
ts-rs = {workspace = true}
wgpu = {workspace = true}

moyu_live2d_abi = {workspace = true}
moyu_core = {workspace = true}
moyu_macros = {workspace = true}
moyu_pal = {workspace = true}
moyu_resource = {workspace = true}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = {workspace = true}
moyu_core = {workspace = true, features = ["js_runtime"]}

[build-dependencies]
cfg_aliases = {workspace = true}
