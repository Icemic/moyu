[package]
authors = ["Icemic <bingfeng.web@gmail.com>"]
description = "Shared engine assembly for Moyu hosts."
edition = "2024"
license = "MPL-2.0"
name = "moyu_app"
repository = "https://github.com/DeepSpaceMill/moyu"
version.workspace = true

[features]
default = ["text"]
text = ["moyu_nodes/text", "moyu_ops/text"]

[dependencies]
anyhow = {workspace = true}
log = {workspace = true}

moyu_audio = {workspace = true}
moyu_core = {workspace = true, features = ["js_runtime"]}
moyu_debugger = {workspace = true}
moyu_gamepad = {workspace = true}
moyu_live2d = {workspace = true}
moyu_nodes = {workspace = true}
moyu_ops = {workspace = true}
moyu_pal = {workspace = true}
moyu_resource = {workspace = true}
moyu_scenario = {workspace = true}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moyu_runtime = {workspace = true}

[build-dependencies]
cfg_aliases = {workspace = true}
