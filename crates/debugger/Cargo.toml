[package]
authors = ["Icemic <bingfeng.web@gmail.com>"]
description = "Runtime debug bridge for Moyu."
edition = "2024"
license = "MPL-2.0"
name = "moyu_debugger"
repository = "https://github.com/Icemic/moyu"
version.workspace = true

[dependencies]
base64 = {workspace = true}
log = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}

moyu_core = {workspace = true}
moyu_ops = {workspace = true}
moyu_pal = {workspace = true}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = "0.3"

# "time" backs the retry backoff and the evaluation timeout.
tokio = {workspace = true, features = ["rt-multi-thread", "macros", "parking_lot", "time"]}
tokio-tungstenite = "0.30"

moyu_core = {workspace = true, features = ["js_runtime"]}
moyu_runtime = {workspace = true}

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = {workspace = true}
wasm-bindgen-futures = {workspace = true}
web-sys = {workspace = true, features = [
  "MessageEvent",
  "Location",
  "UrlSearchParams",
  "WebSocket",
  "Window",
]}

[build-dependencies]
cfg_aliases = {workspace = true}
