<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches src/theme/tokens.json: the start screen follows the browser appearance. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ECEFF0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <title>Moyu Gallery</title>
    <style>
      /*
       * Start screen. Colours mirror the gallery theme (src/theme/tokens.json): a grey page
       * with a 32px grid, borderless white cards, small radii and one green accent. Light and
       * dark come from the browser preference.
       */
      :root {
        color-scheme: light dark;

        --page: #eceff0;
        --surface: #ffffff;
        --control-idle: #f0f3f3;
        --text: #1e2826;
        --text-secondary: #4f5d5b;
        --text-tertiary: #8b9694;
        --accent: #1e6d65;
        --accent-hover: #175d57;
        --accent-press: #124e49;
        --on-accent: #fafcfc;
        --grid: rgb(30 40 38 / 5%);
        --grid-major: rgb(30 40 38 / 9%);

        --radius-surface: 8px;
        --radius-control: 6px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #121212;
          --surface: #1f1f1f;
          --control-idle: #2c2c2c;
          --text: #ededed;
          --text-secondary: #b0b0b0;
          --text-tertiary: #7c7c7c;
          --accent: #8ac9c1;
          --accent-hover: #9ed6ce;
          --accent-press: #74b4ac;
          --on-accent: #13211f;
          --grid: rgb(237 237 237 / 4%);
          --grid-major: rgb(237 237 237 / 7%);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: var(--page);
        color: var(--text);
        font-family:
          system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }

      /* 32px ruling with a heavier line every 160px, as in the engine's page background. */
      body {
        background-image:
          repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 32px),
          repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 32px),
          repeating-linear-gradient(to right, var(--grid-major) 0 1px, transparent 1px 160px),
          repeating-linear-gradient(to bottom, var(--grid-major) 0 1px, transparent 1px 160px);
      }

      #wrapper {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* The engine fills the element it is mounted in, so the page owns the size of the game
         area. */
      #root {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Portrait phones get a landscape game area, rotated to fit the screen. The engine reads
         the unrotated box, so the rotation only affects how the result is displayed. */
      @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
        #root {
          inset: auto;
          top: 50%;
          left: 50%;
          width: 100dvh;
          height: 100dvw;
          transform: translate(-50%, -50%) rotate(90deg);
        }
      }

      #start-screen {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        transition: opacity 180ms ease;
      }

      #start-screen[hidden] {
        display: none;
      }

      .start-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        min-width: min(380px, calc(100vw - 48px));
        padding: 44px 52px 36px;
        border-radius: var(--radius-surface);
        background: var(--surface);
        text-align: center;
      }

      h1 {
        margin: 0;
        color: var(--text);
        font-size: clamp(28px, 4.4vw, 40px);
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }

      p {
        min-height: 1.5em;
        margin: 0;
        color: var(--text-secondary);
        font-size: 16px;
        line-height: 1.5;
      }

      button {
        min-width: 180px;
        padding: 12px 24px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 160ms ease;
      }

      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      button:active:not(:disabled) {
        background: var(--accent-press);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button:disabled {
        background: var(--control-idle);
        color: var(--text-tertiary);
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <div id="root"></div>
    </div>
    <div id="start-screen">
      <div class="start-panel">
        <h1>末语 Gallery</h1>
        <p id="status">正在加载引擎…</p>
        <button id="start-button" type="button" disabled>启动 Gallery</button>
      </div>
    </div>

    <script type="module">
      const startScreen = document.querySelector('#start-screen');
      const startButton = document.querySelector('#start-button');
      const status = document.querySelector('#status');

      window.__moyu_entry = new URL('./index.json', import.meta.url).href;

      try {
        const moyu = await import('./moyu.js');
        await moyu.default();

        window.moyu = {
          pushCommand(name, args) {
            return moyu[name](...args);
          },
          executeNodeCommand(...args) {
            return moyu.execute_node_command(...args);
          },
          executePluginCommand(...args) {
            return moyu.execute_plugin_command(...args);
          },
        };

        status.textContent = '引擎已就绪';
        startButton.disabled = false;
        startButton.addEventListener('click', () => {
          startButton.disabled = true;
          status.textContent = '正在启动…';
          startScreen.hidden = true;
          void moyu.moyu_init('root').catch((error) => {
            console.error('Failed to start Moyu Gallery:', error);
            status.textContent = '启动失败，请查看浏览器控制台';
            startButton.disabled = false;
            startScreen.hidden = false;
          });
        });
      } catch (error) {
        console.error('Failed to load Moyu engine:', error);
        status.textContent = '引擎加载失败，请刷新页面重试';
      }
    </script>
  </body>
</html>
